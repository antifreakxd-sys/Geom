name: Build VANTA Android ARM64

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download pinned Dear ImGui
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 https://github.com/ocornut/imgui/archive/refs/tags/v1.91.9b.tar.gz -o imgui.tar.gz
          mkdir -p deps
          tar -xzf imgui.tar.gz -C deps
          mv deps/imgui-1.91.9b deps/imgui

      - name: Set up Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ] && [ -x "${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" ]; then
            echo "VANTA_NDK=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"
          else
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"
            echo "VANTA_NDK=${ANDROID_HOME}/ndk/27.2.12479018" >> "$GITHUB_ENV"
          fi

      - name: Compile libgdmenu.so
        shell: bash
        run: |
          set -euxo pipefail
          NDK_BIN="$VANTA_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$NDK_BIN/aarch64-linux-android24-clang++" \
            -shared -fPIC -O2 -std=c++17 -fno-exceptions -fno-rtti -static-libstdc++ \
            -DIMGUI_IMPL_OPENGL_ES3 \
            -Isrc -Ideps/imgui -Ideps/imgui/backends \
            src/menu.cpp \
            deps/imgui/imgui.cpp deps/imgui/imgui_draw.cpp \
            deps/imgui/imgui_tables.cpp deps/imgui/imgui_widgets.cpp \
            deps/imgui/backends/imgui_impl_opengl3.cpp \
            -lEGL -lGLESv3 -landroid -llog -ldl -lm \
            -Wl,--no-undefined -o libgdmenu.so
          "$NDK_BIN/llvm-readelf" -h libgdmenu.so | grep -E "Class:|Machine:"
          "$NDK_BIN/llvm-readelf" -d libgdmenu.so | grep NEEDED
          sha256sum libgdmenu.so > libgdmenu.so.sha256

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vanta-auto
          name: VANTA ARM64 — rolling build
          make_latest: true
          prerelease: false
          files: |
            libgdmenu.so
            libgdmenu.so.sha256
          overwrite_files: true
